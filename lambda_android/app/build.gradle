plugins {
    id 'com.android.application'
}

android {
    namespace 'com.obd2.lambda'
    compileSdk 34

    defaultConfig {
        applicationId "com.obd2.lambda"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    signingConfigs {
        debug {
            // Forçar v1+v2 signing para compatibilidade com multimídias automotivas.
            //
            // Chave FIXA e versionada (não a default de ~/.android/debug.keystore,
            // que é gerada por máquina): sem isso, cada máquina que builda o app
            // (ou uma reinstalação do ambiente na mesma máquina) gera uma chave
            // diferente, e instalar por cima de uma versão já presente no
            // dispositivo falha silenciosamente ("app não instalado") por
            // divergência de assinatura — sem desinstalar a versão antiga antes.
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    packagingOptions {
        // Evitar conflitos de arquivos duplicados
        exclude 'META-INF/DEPENDENCIES'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // USB Serial - suporta CH340, FTDI, CP210x, Prolific (todos os clones ELM327 comuns)
    implementation 'com.github.mik3y:usb-serial-for-android:3.7.3'
    // Foreground service para manter o app vivo em background
    implementation 'androidx.core:core:1.12.0'

    // Resolver conflito kotlin-stdlib
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
            because 'kotlin-stdlib-jdk7 merged into kotlin-stdlib'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
            because 'kotlin-stdlib-jdk8 merged into kotlin-stdlib'
        }
    }
}
